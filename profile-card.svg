<svg xmlns="http://www.w3.org/2000/svg" width="840" height="392" viewBox="0 0 840 392">
  <style>
    text { font-family: Tahoma, Verdana, "Segoe UI", sans-serif; font-size: 13px; fill: #2f2d2a; }

    .window   { fill: #eeebe2; }
    .frame    { fill: #6b7347; }
    .title    { font-weight: bold; fill: #ffffff; }
    .title-shadow { font-weight: bold; fill: #000000; opacity: 0.35; }

    .name     { font-size: 22px; font-weight: bold; fill: #585d33; }
    .muted    { fill: #57524f; }
    .accent   { font-weight: bold; fill: #585d33; }

    .group       { fill: none; stroke: #cdc6b6; }
    .group-label { font-size: 12px; fill: #7d5f7c; }

    .btn       { stroke: #f4f1e6; }
    .btn-icon  { fill: none; stroke: #ffffff; stroke-width: 2; }
    .status    { font-size: 11px; fill: #57524f; }
    .separator { stroke: #c9c2b1; }
  </style>

  <defs>
    <!-- olive title bar, like the XP "Olive Green" theme -->
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c99d"/>
      <stop offset="0.12" stop-color="#959e68"/>
      <stop offset="0.55" stop-color="#848e58"/>
      <stop offset="0.9" stop-color="#8e9862"/>
      <stop offset="1" stop-color="#6c7546"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5bf97"/>
      <stop offset="1" stop-color="#7f8b5c"/>
    </linearGradient>
    <linearGradient id="btn-close" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7a08a"/>
      <stop offset="1" stop-color="#a65d4b"/>
    </linearGradient>
    <linearGradient id="statusbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f0e7"/>
      <stop offset="1" stop-color="#e0dbcd"/>
    </linearGradient>

    <rect id="title-btn" width="21" height="21" rx="3"/>
  </defs>

  <!-- window -->
  <rect class="frame" x="1" y="1" width="838" height="390" rx="8"/>
  <rect class="window" x="4" y="30" width="832" height="358"/>

  <!-- title bar -->
  <path d="M1 9 a8 8 0 0 1 8 -8 h822 a8 8 0 0 1 8 8 v21 h-838 z" fill="url(#titlebar)"/>
  <g transform="translate(12 8)">
    <rect class="window" width="15" height="15" rx="2" stroke="#ffffff"/>
    <rect x="2" y="2" width="11" height="3" fill="#a98ea8"/>
  </g>
  <text class="title-shadow" x="35" y="21">Dmytro Lytvak</text>
  <text class="title" x="34" y="20">Dmytro Lytvak</text>

  <!-- minimize / maximize / close -->
  <g transform="translate(761 5)">
    <use href="#title-btn" class="btn" fill="url(#btn)"/>
    <use href="#title-btn" class="btn" fill="url(#btn)" x="24"/>
    <use href="#title-btn" class="btn" fill="url(#btn-close)" x="48"/>
    <path class="btn-icon" d="M5 14.5 h8"/>
    <rect class="btn-icon" x="29" y="5" width="11" height="11"/>
    <path class="btn-icon" d="M53 5 l11 11 M64 5 l-11 11" stroke-linecap="round"/>
  </g>

  <!-- header -->
  <text class="name" x="24" y="66">Dmytro Lytvak</text>
  <text class="muted" x="24" y="88">Associate QA Automation Engineer - GlobalLogic</text>

  <!-- each group box: frame, label with a background patch to cut the border, then lines of text -->
  <g transform="translate(20 110)">
    <rect class="group" width="800" height="92" rx="3"/>
    <rect class="window" x="10" y="-8" width="98" height="16"/>
    <text class="group-label" x="14" y="4">Current work</text>
    <text x="16" y="28">API test automation for a payment platform.</text>
    <text x="16" y="50">Building and maintaining the test framework: API clients, pydantic schemas, test data factories, DB checks.</text>
    <text x="16" y="72">Focus on edge cases and exception scenarios, not just the happy path.</text>
  </g>

  <g transform="translate(20 222)">
    <rect class="group" width="800" height="70" rx="3"/>
    <rect class="window" x="10" y="-8" width="46" height="16"/>
    <text class="group-label" x="14" y="4">Stack</text>
    <text x="16" y="28"><tspan class="accent">Now:</tspan>  Python - pytest - Requests - pydantic - polyfactory - PostgreSQL</text>
    <text x="16" y="50"><tspan class="accent">Earlier:</tspan>  Java - JUnit 5 - Playwright - REST Assured - Postman - Allure</text>
  </g>

  <g transform="translate(20 312)">
    <rect class="group" width="800" height="44" rx="3"/>
    <rect class="window" x="10" y="-8" width="82" height="16"/>
    <text class="group-label" x="14" y="4">Background</text>
    <text x="16" y="28">Studied software development before moving into QA, and built a few game prototypes in Godot along the way.</text>
  </g>

  <!-- status bar -->
  <g transform="translate(4 366)">
    <rect width="832" height="22" fill="url(#statusbar)"/>
    <line class="separator" x2="832"/>
    <line class="separator" x1="636" y1="3" x2="636" y2="19"/>
    <text class="status" x="8" y="15">github.com/lytvakdmytro</text>
    <text class="status" x="646" y="15">Ukraine</text>
  </g>
</svg>
