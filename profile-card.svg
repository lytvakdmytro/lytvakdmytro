<svg xmlns="http://www.w3.org/2000/svg" width="840" height="392" viewBox="0 0 840 392" font-family="Tahoma, Verdana, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c99d"/>
      <stop offset="0.12" stop-color="#959e68"/>
      <stop offset="0.55" stop-color="#848e58"/>
      <stop offset="0.9" stop-color="#8e9862"/>
      <stop offset="1" stop-color="#6c7546"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5bf97"/>
      <stop offset="1" stop-color="#7f8b5c"/>
    </linearGradient>
    <linearGradient id="btnRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7a08a"/>
      <stop offset="1" stop-color="#a65d4b"/>
    </linearGradient>
    <linearGradient id="statusbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f0e7"/>
      <stop offset="1" stop-color="#e0dbcd"/>
    </linearGradient>
  </defs>

  <!-- Window frame -->
  <rect x="1" y="1" width="838" height="390" rx="8" fill="#6b7347"/>
  <rect x="4" y="30" width="832" height="358" fill="#eeebe2"/>

  <!-- Title bar -->
  <path d="M1 9 a8 8 0 0 1 8 -8 h822 a8 8 0 0 1 8 8 v21 h-838 z" fill="url(#titlebar)"/>
  <rect x="12" y="8" width="15" height="15" rx="2" fill="#eeebe2" stroke="#ffffff" stroke-width="1"/>
  <rect x="14" y="10" width="11" height="3" fill="#a98ea8"/>
  <text x="35" y="21" font-size="13" font-weight="bold" fill="#000000" opacity="0.35">Dmytro Lytvak</text>
  <text x="34" y="20" font-size="13" font-weight="bold" fill="#ffffff">Dmytro Lytvak</text>

  <!-- Title bar buttons -->
  <g stroke="#f4f1e6" stroke-width="1">
    <rect x="761" y="5" width="21" height="21" rx="3" fill="url(#btnBlue)"/>
    <rect x="785" y="5" width="21" height="21" rx="3" fill="url(#btnBlue)"/>
    <rect x="809" y="5" width="21" height="21" rx="3" fill="url(#btnRed)"/>
  </g>
  <rect x="766" y="18" width="8" height="3" fill="#ffffff"/>
  <rect x="790" y="10" width="11" height="11" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M814 10 l11 11 M825 10 l-11 11" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Header -->
  <text x="24" y="66" font-size="22" font-weight="bold" fill="#585d33">Dmytro Lytvak</text>
  <text x="24" y="88" font-size="13" fill="#57524f">Associate QA Automation Engineer · GlobalLogic</text>

  <!-- Group box: Current work -->
  <rect x="20" y="110" width="800" height="92" rx="3" fill="none" stroke="#cdc6b6"/>
  <rect x="30" y="102" width="98" height="16" fill="#eeebe2"/>
  <text x="34" y="114" font-size="12" fill="#7d5f7c">Current work</text>
  <g font-size="13" fill="#2f2d2a">
    <text x="36" y="138">API test automation for a payment platform, as the only automation engineer on a two-person QA team.</text>
    <text x="36" y="160">I own the test framework: API clients on a shared base class, pydantic schemas, test data factories, DB checks.</text>
    <text x="36" y="182">Focus on edge cases and exception scenarios, not just the happy path.</text>
  </g>

  <!-- Group box: Stack -->
  <rect x="20" y="222" width="800" height="70" rx="3" fill="none" stroke="#cdc6b6"/>
  <rect x="30" y="214" width="46" height="16" fill="#eeebe2"/>
  <text x="34" y="226" font-size="12" fill="#7d5f7c">Stack</text>
  <g font-size="13" fill="#2f2d2a">
    <text x="36" y="250"><tspan font-weight="bold" fill="#585d33">Now:</tspan>  Python · pytest · Requests · pydantic · polyfactory · PostgreSQL</text>
    <text x="36" y="272"><tspan font-weight="bold" fill="#585d33">Earlier:</tspan>  Java · JUnit 5 · Playwright · REST Assured · Postman · Allure</text>
  </g>

  <!-- Group box: Background -->
  <rect x="20" y="312" width="800" height="44" rx="3" fill="none" stroke="#cdc6b6"/>
  <rect x="30" y="304" width="82" height="16" fill="#eeebe2"/>
  <text x="34" y="316" font-size="12" fill="#7d5f7c">Background</text>
  <text x="36" y="340" font-size="13" fill="#2f2d2a">Came to QA from software development, with a few game prototypes in Godot along the way.</text>

  <!-- Status bar -->
  <rect x="4" y="366" width="832" height="22" fill="url(#statusbar)"/>
  <line x1="4" y1="366" x2="836" y2="366" stroke="#c9c2b1"/>
  <line x1="640" y1="369" x2="640" y2="385" stroke="#c9c2b1"/>
  <text x="12" y="381" font-size="11" fill="#57524f">github.com/lytvakdmytro</text>
  <text x="650" y="381" font-size="11" fill="#57524f">Ukraine · GMT+2</text>
</svg>
